# Channel-stats probes on central repeater R5 of multi_path.yaml with fsupp_floods traffic.
# stats-radio JSON keys (new fields): util = chan utilization %, deaf = RX deafness %,
# good/tot = RX-quality window counts (err % derivable as 100 - good*100/tot).
#   @30  -> before chat/flood traffic starts: expect util:0, deaf:0, good == tot (no errors)
#   @90/@150/@170 -> during flood forwarding: expect 0..100 values, deaf > 0 in at
#                    least one probe (R5 transmits within the 5s window), util
#                    bursts above 0 when forwarded traffic lands in-window.
# Run:
#   cargo run -- run examples/topologies/multi_path.yaml \
#                  examples/behaviors/fsupp_floods.yaml \
#                  examples/behaviors/chanstats_probe.yaml \
#                  --duration 180s --seed 1 --sequential --output /tmp/trace_chanstats.json --trace "R5"
nodes:
  - name: "R5"
    cli:
      scheduled:
        - "@30 stats-radio"
        - "@90 stats-radio"
        - "@150 stats-radio"
        - "@170 stats-radio"
