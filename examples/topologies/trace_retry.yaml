# TRACE Retry Topology
#
# Demonstrates firmware-level per-hop retries for TRACE path packets across a
# chain of marginal forward hops.  TRACE packets are direct-routed along the
# configured path; each intermediate hop retransmits up to
# (max_resend_attempts + 1) times until it overhears the next hop forwarding.
#
# Network topology:
#
#   Alice ─15dB±2σ─► R1 ─-3dB±4σ─► R2 ─-3dB±4σ─► R3 ─-3dB±4σ─► Bob
#            ◄─10dB±2σ──    ◄─10dB±2σ──    ◄─10dB±2σ──    ◄─10dB±2σ──
#
# Node roles:
#   Alice – Companion, TRACE sender
#   R1    – Repeater, hop 1 (listed in TRACE path)
#   R2    – Repeater, hop 2 (listed in TRACE path)
#   R3    – Repeater, hop 3 (listed in TRACE path)
#   Bob   – Companion, TRACE destination (receives TRACE after R3 forwards it)
#
# Link qualities (SF7, BW 62.5 kHz, threshold -7.5 dB):
#   Forward (TRACE direction) — marginal, ~87% per-packet loss each:
#     Alice → R1:  15 dB ±2σ  →  ~100%  (reliable first hop)
#     R1    → R2:  -3 dB ±4σ  →   ~87%  MARGINAL
#     R2    → R3:  -3 dB ±4σ  →   ~87%  MARGINAL
#     R3    → Bob: -3 dB ±4σ  →   ~87%  MARGINAL
#   Return (overhear forwarding for resend cancellation) — reliable:
#     R1 → Alice:  10 dB ±2σ  →  ~100%
#     R2 → R1:     10 dB ±2σ  →  ~100%
#     R3 → R2:     10 dB ±2σ  →  ~100%
#     Bob → R3:    10 dB ±2σ  →  ~100%
#
# With max_resend_attempts=2 each intermediate hop tries up to 3 TX. The last hop
# (R3 → Bob) does NOT retry: the destination does not forward the TRACE, so a
# retry could never be cancelled by overhearing a downstream forward. This avoids
# flooding the destination; the sender must retry the entire TRACE if needed.
#
# Run with:
#   cargo run -- run examples/topologies/trace_retry.yaml \
#                    examples/behaviors/trace_stress.yaml    \
#                    --duration 350s --seed 1234 --trace

defaults:
  node:
    radio:
      frequency_hz: 910525000
      bandwidth_hz: 62500
      spreading_factor: 7
      coding_rate: 5
      tx_power_dbm: 20
    firmware:
      max_resend_attempts: 2  # 3 TX per hop total

nodes:
  - name: "Alice"
    location:
      lat: 47.6100
      lon: -122.4200
    firmware:
      type: Companion
    keys:
      public_key: "0A*"

  - name: "R1"
    location:
      lat: 47.6100
      lon: -122.3800
    firmware:
      type: Repeater
    keys:
      public_key: "01*"

  - name: "R2"
    location:
      lat: 47.6100
      lon: -122.3400
    firmware:
      type: Repeater
    keys:
      public_key: "02*"

  - name: "R3"
    location:
      lat: 47.6100
      lon: -122.3000
    firmware:
      type: Repeater
    keys:
      public_key: "03*"

  - name: "Bob"
    location:
      lat: 47.6100
      lon: -122.2600
    firmware:
      type: Companion
    keys:
      public_key: "0B*"

edges:
  # ── Alice ↔ R1 ───────────────────────────────────────────────────────────
  - from: "Alice"
    to: "R1"
    mean_snr_db_at20dbm: 15.0
    snr_std_dev: 2.0
  - from: "R1"
    to: "Alice"
    mean_snr_db_at20dbm: 10.0
    snr_std_dev: 2.0

  # ── R1 ↔ R2: marginal forward, reliable return ───────────────────────────
  - from: "R1"
    to: "R2"
    mean_snr_db_at20dbm: -3.0
    snr_std_dev: 4.0
  - from: "R2"
    to: "R1"
    mean_snr_db_at20dbm: 10.0
    snr_std_dev: 2.0

  # ── R2 ↔ R3: marginal forward, reliable return ───────────────────────────
  - from: "R2"
    to: "R3"
    mean_snr_db_at20dbm: -3.0
    snr_std_dev: 4.0
  - from: "R3"
    to: "R2"
    mean_snr_db_at20dbm: 10.0
    snr_std_dev: 2.0

  # ── R3 ↔ Bob: marginal forward, reliable return ──────────────────────────
  - from: "R3"
    to: "Bob"
    mean_snr_db_at20dbm: -3.0
    snr_std_dev: 4.0
  - from: "Bob"
    to: "R3"
    mean_snr_db_at20dbm: 10.0
    snr_std_dev: 2.0
