# Final-Hop Swarm-Relay Cancel Repro (clean)
#
# Chain only: Alice ─► R1 ─► R2 ─► R3 ─► Bob  (R1→R2, R2→R3 RELIABLE so R2 forwards pl1 and
# R3 forwards pl0 on every DM; R3→Bob marginal is fine — R3 still TX's its pl0 forward, and the
# first flood DM still reaches Bob for path discovery).
# H_final: overhears R2's [R3] forward (count==1 → schedules pc==0 relay, strips R3 → path=∅)
#          and R3's [∅] final forward (the count==0 cancel trigger). Neighbour of R3 (SNR gate A).
# NO H_final→Bob edge (would create a flood shortcut that breaks path-return) and no extra helpers
# (Swarm01 would hijack the direct path via R1→Swarm01→R3).
#
# A/B (per DM, count DIRECT TextMessage TX with path_len==0):
#   BUG (fix reverted): R3 pl0 + H_final pl0 (uncancelled relay) = 2.
#   FIX (this branch):  R3 pl0 only (H_final cancels on R3's count==0 forward) = 1.

defaults:
  node:
    radio:
      frequency_hz: 910525000
      bandwidth_hz: 62500
      spreading_factor: 7
      coding_rate: 5
      tx_power_dbm: 20
    firmware:
      max_resend_attempts: 0
      direct_swarm_fwd: true

nodes:
  - name: "Alice"
    location: { lat: 47.6100, lon: -122.4200 }
    firmware: { type: Companion }
    keys: { public_key: "0A*" }

  - name: "R1"
    location: { lat: 47.6100, lon: -122.3800 }
    firmware: { type: Repeater }
    keys: { public_key: "01*" }

  - name: "R2"
    location: { lat: 47.6100, lon: -122.3400 }
    firmware: { type: Repeater }
    keys: { public_key: "02*" }

  - name: "R3"
    location: { lat: 47.6100, lon: -122.3000 }
    firmware: { type: Repeater }
    keys: { public_key: "03*" }

  - name: "Bob"
    location: { lat: 47.6100, lon: -122.2600 }
    firmware: { type: Companion }
    keys: { public_key: "0B*" }

  - name: "H_final"
    location: { lat: 47.6200, lon: -122.3000 }
    firmware: { type: Repeater }
    keys: { public_key: "06*" }

edges:
  # Forward (data) path: R1→R2, R2→R3 RELIABLE; R3→Bob marginal (only affects Bob's delivery).
  - { from: "Alice", to: "R1", mean_snr_db_at20dbm: 15.0, snr_std_dev: 2.0 }
  - { from: "R1",    to: "R2", mean_snr_db_at20dbm: 15.0, snr_std_dev: 1.0 }
  - { from: "R2",    to: "R3", mean_snr_db_at20dbm: 15.0, snr_std_dev: 1.0 }
  - { from: "R3",    to: "Bob", mean_snr_db_at20dbm: -3.0, snr_std_dev: 4.0 }
  # Return (ACK / path-return) path — RELIABLE.
  - { from: "R1",  to: "Alice", mean_snr_db_at20dbm: 15.0, snr_std_dev: 2.0 }
  - { from: "R2",  to: "R1",    mean_snr_db_at20dbm: 15.0, snr_std_dev: 2.0 }
  - { from: "R3",  to: "R2",    mean_snr_db_at20dbm: 15.0, snr_std_dev: 2.0 }
  - { from: "Bob", to: "R3",    mean_snr_db_at20dbm: 10.0, snr_std_dev: 2.0 }

  # H_final: overhears R2's [R3] forward + R3's [∅] forward; neighbour of R3. NO H_final→Bob.
  - { from: "R2",      to: "H_final", mean_snr_db_at20dbm: 12.0, snr_std_dev: 1.0 }
  - { from: "R3",      to: "H_final", mean_snr_db_at20dbm: 12.0, snr_std_dev: 1.0 }
  - { from: "H_final", to: "R3",      mean_snr_db_at20dbm: 12.0, snr_std_dev: 1.0 }
