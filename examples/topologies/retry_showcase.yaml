# Retry Showcase Topology
#
# Demonstrates the value of repeated sending (retransmissions) in MeshCore.
# Three repeaters form a chain between Alice and Bob.  Each forward hop is
# deliberately marginal; only the return (ACK/PATH) direction is reliable.
# No backup path exists — only Alice's retry mechanism can compensate.
#
# Network topology:
#
#                              Observer
#                          (Repeater — neighbor of R2 only, NOT on path)
#                               │
#                            12dB ±1σ
#                               │
#   Alice ─15dB±2σ─ R1 ─-3dB±4σ─► R2 ─-3dB±4σ─► R3 ─-3dB±4σ─► Bob ─15dB±2σ─ Sidecar
#                   ◄─10dB±2σ──    ◄─10dB±2σ──    ◄─10dB±2σ──       ◄────────   (Repeater — neighbor of Bob only)
#
# Node roles:
#   Alice    – Companion, DM sender                       [in communication]
#   R1       – Repeater, hop 1 on Alice→Bob path          [in communication]
#   R2       – Repeater, hop 2 on Alice→Bob path          [in communication]
#   R3       – Repeater, hop 3 on Alice→Bob path          [in communication]
#   Bob      – Companion, DM receiver                     [in communication]
#   Observer – Repeater, neighbor of R2 only              [NOT in communication]
#   Sidecar  – Repeater, neighbor of Bob only             [NOT in communication]
#
# Neighbour relationships:
#   Alice    knows: R1 only
#   R1       knows: Alice, R2
#   R2       knows: R1, R3, Observer
#   R3       knows: R2, Bob
#   Bob      knows: R3, Sidecar
#   Observer knows: R2 only       (hears R2's forwarding but never routes anything)
#   Sidecar  knows: Bob only      (hears Bob's ACKs but never routes anything)
#
# Link qualities (SF7, BW 62.5 kHz, threshold -7.5 dB):
#   Forward (DM direction) — marginal, 13% per-packet loss each:
#     Alice → R1:  15 dB ±2σ  →  ~100%  (reliable first hop, Alice transmits directly)
#     R1    → R2:  -3 dB ±4σ  →   ~87%  MARGINAL
#     R2    → R3:  -3 dB ±4σ  →   ~87%  MARGINAL
#     R3    → Bob: -3 dB ±4σ  →   ~87%  MARGINAL
#   Return (ACK + PATH direction) — all reliable:
#     R1 → Alice:  15 dB ±2σ  →  ~100%
#     R2 → R1:     10 dB ±2σ  →  ~100%
#     R3 → R2:     10 dB ±2σ  →  ~100%
#     Bob → R3:    10 dB ±2σ  →  ~100%
#   Side links — reliable, not on the communication path:
#     R2 ↔ Observer: 12 dB ±1σ →  ~100%
#     Bob ↔ Sidecar: 15 dB ±2σ →  ~100%
#
# Asymmetric links isolate the retry demonstration:
#   Path discovery always works (Bob→R3→R2→R1→Alice all reliable).
#   Only Alice's DMs face the three marginal forward hops.
#
# Expected delivery statistics per message attempt:
#   FLOOD route (first DM, no path discovered yet):
#     P(DM reaches Bob via FLOOD | 1 TX) = 0.87³ ≈ 66%
#     Note: Alice's TX2/TX3 are blocked by R1's hasSeen ring-buffer — no retry benefit.
#     A successful FLOOD DM causes Bob to reply with PATH+ACK, giving Alice Bob's route.
#   DIRECT route (subsequent DMs after path discovery, max_resend_attempts=2 → 3 TX/hop):
#     P(hop fails | 3 TX) = 0.13³ ≈ 0.2%
#     P(DM reaches Bob via DIRECT | 3 TX/hop) = (1−0.13³)³ ≈ 99.3%
#   → path_warmup_count=1 in behavior triggers path discovery before counted session
#
# Run with:
#   cargo run -- run examples/topologies/retry_showcase.yaml \
#                    examples/behaviors/retry_stress.yaml    \
#                    --duration 350s --seed 1234 --metrics-output json

defaults:
  node:
    radio:
      frequency_hz: 910525000
      bandwidth_hz: 62500
      spreading_factor: 7
      coding_rate: 5
      tx_power_dbm: 20

nodes:
  # ── Active communication path ────────────────────────────────────────────
  - name: "Alice"
    location:
      lat: 47.6100
      lon: -122.4200
    firmware:
      type: Companion
    keys:
      public_key: "0A*"

  - name: "R1"
    location:
      lat: 47.6100
      lon: -122.3800
    firmware:
      type: Repeater
    keys:
      public_key: "01*"

  - name: "R2"
    location:
      lat: 47.6100
      lon: -122.3400
    firmware:
      type: Repeater
    keys:
      public_key: "02*"

  - name: "R3"
    location:
      lat: 47.6100
      lon: -122.3000
    firmware:
      type: Repeater
    keys:
      public_key: "03*"

  - name: "Bob"
    location:
      lat: 47.6100
      lon: -122.2600
    firmware:
      type: Companion
    keys:
      public_key: "0B*"

  # ── Nodes NOT on the Alice→Bob path ─────────────────────────────────────
  - name: "Observer"
    # Sits above R2; reliable link to R2 only.
    # Hears R2's retransmissions; is never a routing hop.
    location:
      lat: 47.6350
      lon: -122.3400
    firmware:
      type: Repeater
    keys:
      public_key: "04*"

  - name: "Sidecar"
    # Sits below Bob; reliable link to Bob only.
    # Hears Bob's ACKs; plays no role in DM delivery.
    location:
      lat: 47.5850
      lon: -122.2600
    firmware:
      type: Repeater
    keys:
      public_key: "05*"

edges:
  # ── Alice ↔ R1: reliable both ways (Alice transmits directly, ACKs return) ─
  - from: "Alice"
    to: "R1"
    mean_snr_db_at20dbm: 15.0
    snr_std_dev: 2.0
  - from: "R1"
    to: "Alice"
    mean_snr_db_at20dbm: 15.0
    snr_std_dev: 2.0

  # ── R1 → R2: MARGINAL (DM forward) ──────────────────────────────────────
  - from: "R1"
    to: "R2"
    mean_snr_db_at20dbm: -3.0
    snr_std_dev: 4.0
  # ── R2 → R1: reliable (ACK/PATH return) ─────────────────────────────────
  - from: "R2"
    to: "R1"
    mean_snr_db_at20dbm: 10.0
    snr_std_dev: 2.0

  # ── R2 → R3: MARGINAL (DM forward) ──────────────────────────────────────
  - from: "R2"
    to: "R3"
    mean_snr_db_at20dbm: -3.0
    snr_std_dev: 4.0
  # ── R3 → R2: reliable (ACK/PATH return) ─────────────────────────────────
  - from: "R3"
    to: "R2"
    mean_snr_db_at20dbm: 10.0
    snr_std_dev: 2.0

  # ── R3 → Bob: MARGINAL (DM forward, last hop) ────────────────────────────
  - from: "R3"
    to: "Bob"
    mean_snr_db_at20dbm: -3.0
    snr_std_dev: 4.0
  # ── Bob → R3: reliable (ACK return) ─────────────────────────────────────
  - from: "Bob"
    to: "R3"
    mean_snr_db_at20dbm: 10.0
    snr_std_dev: 2.0

  # ── Observer: neighbor of R2 only ────────────────────────────────────────
  - from: "R2"
    to: "Observer"
    mean_snr_db_at20dbm: 12.0
    snr_std_dev: 1.0
  - from: "Observer"
    to: "R2"
    mean_snr_db_at20dbm: 12.0
    snr_std_dev: 1.0

  # ── Sidecar: neighbor of Bob only ────────────────────────────────────────
  - from: "Bob"
    to: "Sidecar"
    mean_snr_db_at20dbm: 15.0
    snr_std_dev: 2.0
  - from: "Sidecar"
    to: "Bob"
    mean_snr_db_at20dbm: 15.0
    snr_std_dev: 2.0
