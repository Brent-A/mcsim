# TRACE Retry Topology — ideal links
#
# Variant of trace_retry.yaml with all links set to 100% delivery.
# Useful for analysing the base TRACE forwarding logic without per-hop
# packet loss complicating the picture.
#
# Network topology:
#
#   Alice ─15dB±0σ─► R1 ─15dB±0σ─► R2 ─15dB±0σ─► R3 ─15dB±0σ─► Bob
#            ◄─15dB±0σ──    ◄─15dB±0σ──    ◄─15dB±0σ──    ◄─15dB±0σ──
#
# Node roles:
#   Alice – Companion, TRACE sender
#   R1    – Repeater, hop 1 (listed in TRACE path)
#   R2    – Repeater, hop 2 (listed in TRACE path)
#   R3    – Repeater, hop 3 (listed in TRACE path)
#   Bob   – Companion, TRACE destination (receives TRACE after R3 forwards it)
#
# Link qualities (SF7, BW 62.5 kHz, threshold -7.5 dB):
#   All links: 15 dB ±0σ  →  100% deterministic delivery
#
# With ideal links Bob receives exactly one copy of each TRACE: intermediate
# hops forward once, and the last hop (R3 → Bob) does not retry because the
# destination does not forward the TRACE and therefore cannot cancel a retry.
#
# Run with:
#   cargo run -- run examples/topologies/trace_retry_goodlinks.yaml \
#                    examples/behaviors/trace_stress.yaml            \
#                    --duration 350s --seed 1234 --trace

defaults:
  node:
    radio:
      frequency_hz: 910525000
      bandwidth_hz: 62500
      spreading_factor: 7
      coding_rate: 5
      tx_power_dbm: 20
    firmware:
      max_resend_attempts: 2  # 3 TX per hop total

nodes:
  - name: "Alice"
    location:
      lat: 47.6100
      lon: -122.4200
    firmware:
      type: Companion
    keys:
      public_key: "0A*"

  - name: "R1"
    location:
      lat: 47.6100
      lon: -122.3800
    firmware:
      type: Repeater
    keys:
      public_key: "01*"

  - name: "R2"
    location:
      lat: 47.6100
      lon: -122.3400
    firmware:
      type: Repeater
    keys:
      public_key: "02*"

  - name: "R3"
    location:
      lat: 47.6100
      lon: -122.3000
    firmware:
      type: Repeater
    keys:
      public_key: "03*"

  - name: "Bob"
    location:
      lat: 47.6100
      lon: -122.2600
    firmware:
      type: Companion
    keys:
      public_key: "0B*"

edges:
  # ── Alice ↔ R1 ───────────────────────────────────────────────────────────
  - from: "Alice"
    to: "R1"
    mean_snr_db_at20dbm: 15.0
    snr_std_dev: 0.0
  - from: "R1"
    to: "Alice"
    mean_snr_db_at20dbm: 15.0
    snr_std_dev: 0.0

  # ── R1 ↔ R2: ideal both ways ─────────────────────────────────────────────
  - from: "R1"
    to: "R2"
    mean_snr_db_at20dbm: 15.0
    snr_std_dev: 0.0
  - from: "R2"
    to: "R1"
    mean_snr_db_at20dbm: 15.0
    snr_std_dev: 0.0

  # ── R2 ↔ R3: ideal both ways ─────────────────────────────────────────────
  - from: "R2"
    to: "R3"
    mean_snr_db_at20dbm: 15.0
    snr_std_dev: 0.0
  - from: "R3"
    to: "R2"
    mean_snr_db_at20dbm: 15.0
    snr_std_dev: 0.0

  # ── R3 ↔ Bob: ideal both ways ────────────────────────────────────────────
  - from: "R3"
    to: "Bob"
    mean_snr_db_at20dbm: 15.0
    snr_std_dev: 0.0
  - from: "Bob"
    to: "R3"
    mean_snr_db_at20dbm: 15.0
    snr_std_dev: 0.0
